plugins {
    // 26.1 is unobfuscated: use the new "net.fabricmc.fabric-loom" plugin
    // (the legacy "fabric-loom" plugin only handles obfuscated MC versions).
    id 'net.fabricmc.fabric-loom' version '1.16.2'
    id 'maven-publish'
    id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "bettercontroller" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = uri("https://maven.fabricmc.net/")
    }
}

dependencies {
    // 26.1+ is unobfuscated and the new fabric-loom plugin no longer remaps
    // Minecraft or mods. The "minecraft" configuration still drives Loom's
    // setup, but mappings and modImplementation are gone.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Xlint:-path'])
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
    finalizedBy(jacocoTestReport)
}

jacocoTestReport {
    dependsOn(test)

    classDirectories.from(files(
        sourceSets.client.output.classesDirs,
        sourceSets.main.output.classesDirs
    ))
    sourceDirectories.from(files(
        sourceSets.client.allSource.srcDirs,
        sourceSets.main.allSource.srcDirs
    ))

    reports {
        xml.required = true
        html.required = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
