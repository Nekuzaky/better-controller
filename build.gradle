plugins {
    // 26.1 is unobfuscated: use the new "net.fabricmc.fabric-loom" plugin
    // (the legacy "fabric-loom" plugin only handles obfuscated MC versions).
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'jacoco'
}

// The Minecraft version rides along as semver build metadata, so JARs from the
// different version branches never share a file name: bettercontroller-0.3.0+1.21.11.jar
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "bettercontroller" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = uri("https://maven.fabricmc.net/")
    }
}

dependencies {
    // 26.1+ is unobfuscated and the new fabric-loom plugin no longer remaps
    // Minecraft or mods. The "minecraft" configuration still drives Loom's
    // setup, but mappings and modImplementation are gone.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    // Captured at configuration time: reading project inside the action is deprecated in Gradle 9.
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Xlint:-path'])
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
    finalizedBy(jacocoTestReport)
}

jacocoTestReport {
    dependsOn(test)

    classDirectories.from(files(
        sourceSets.client.output.classesDirs,
        sourceSets.main.output.classesDirs
    ))
    sourceDirectories.from(files(
        sourceSets.client.allSource.srcDirs,
        sourceSets.main.allSource.srcDirs
    ))

    reports {
        xml.required = true
        html.required = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archivesName = base.archivesName.get()
    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
}
