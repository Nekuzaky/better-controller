buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 2.3 is the only line that still builds 1.12.2. It pins us to Gradle 4.x
        // and Java 8, which is also what the game itself runs on.
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '2.3-SNAPSHOT', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = 'run'
    mappings = project.mappings_version
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

dependencies {
    // GLFW is shipped inside the jar and loaded reflectively at runtime, never on Minecraft's
    // classpath -- LWJGL 2 and LWJGL 3 both define org.lwjgl.PointerBuffer and they are not
    // the same class. compileOnly keeps it off the compile classpath of everything else.
    compileOnly 'org.lwjgl:lwjgl:3.3.3'
    compileOnly 'org.lwjgl:lwjgl-glfw:3.3.3'

    testCompile 'junit:junit:4.13.2'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
