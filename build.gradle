buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 2.3 is the only line that still builds 1.12.2. It pins us to Gradle 4.x
        // and Java 8, which is also what the game itself runs on.
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '2.3-SNAPSHOT', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    // Each version branch gets its own run directory. They were sharing one, and a modern
    // options.txt is unreadable to 1.12.2 - 66 options were being skipped every launch, every
    // key binding falling back to its default - while 1.12.2 wrote it back in a format the newer
    // branches cannot read either.
    runDir = "run-${project.minecraft_version}"
    mappings = project.mappings_version
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

// LWJGL 3 rides along inside the jar and is loaded reflectively into a classloader of its own at
// runtime. Deliberately NOT a compile dependency: GlfwBridge names no LWJGL type, and keeping the
// classes off every compile classpath is what guarantees nothing can accidentally link against
// LWJGL 3 and collide with the LWJGL 2 the game runs on.
configurations {
    glfwBundle
}

dependencies {
    glfwBundle "org.lwjgl:lwjgl:${project.lwjgl_version}"
    glfwBundle "org.lwjgl:lwjgl-glfw:${project.lwjgl_version}"
    glfwBundle "org.lwjgl:lwjgl:${project.lwjgl_version}:natives-windows"
    glfwBundle "org.lwjgl:lwjgl-glfw:${project.lwjgl_version}:natives-windows"
    glfwBundle "org.lwjgl:lwjgl:${project.lwjgl_version}:natives-linux"
    glfwBundle "org.lwjgl:lwjgl-glfw:${project.lwjgl_version}:natives-linux"
    glfwBundle "org.lwjgl:lwjgl:${project.lwjgl_version}:natives-macos"
    glfwBundle "org.lwjgl:lwjgl-glfw:${project.lwjgl_version}:natives-macos"

    testCompile 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}


processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    // GlfwBridge unpacks these by name at first run; the version is stripped so it has one fixed
    // set of names to look for. Done here rather than in the jar task so the development client
    // gets them too - it runs off build/resources, never off the packaged jar.
    into('bettercontroller-lib') {
        from configurations.glfwBundle
        rename { name -> name.replace("-${project.lwjgl_version}", '') }
    }
}

// The test sources are shared verbatim with the other version branches, so they stay on JUnit 5
// rather than being rewritten for 4 - JUnit 4 puts the assertion message first and 5 puts it last,
// and rewriting every call would make these files diverge for no gain. Gradle 4.6 onwards can run
// the JUnit 5 platform directly.
test {
    useJUnitPlatform()
}
