name: CI

# One branch per Minecraft version: main tracks the latest release, mc/<version>
# keeps every older line buildable. Each branch carries its own copy of this file
# with the JDK its toolchain needs.
on:
  push:
    branches: [main, 'mc/**']
  pull_request:
    branches: [main, 'mc/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Loom 1.18 needs Gradle to run on Java 25. The mod itself is still compiled
  # with --release 21, so players keep the Java Minecraft ships with.
  BUILD_JDK: '25'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.BUILD_JDK }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JDK }}
          cache: gradle

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: JUnit Tests
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/
          # The report is always produced (test is finalizedBy jacocoTestReport), so a missing
          # one means report generation broke -- which should be loud, not a silent no-op.
          if-no-files-found: error

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bettercontroller-snapshot
          path: |
            build/libs/bettercontroller-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
