name: CI

# One branch per Minecraft version: main tracks the latest release, mc/<version>
# keeps every older line buildable. Each branch carries its own copy of this file
# with the JDK its toolchain needs.
on:
  push:
    branches: [main, 'mc/**']
  pull_request:
    branches: [main, 'mc/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ForgeGradle 2.3 is the only toolchain that still builds 1.12.2, and it pins
  # Gradle 4.10.3 and Java 8 - which is also what the game itself runs on.
  BUILD_JDK: '8'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.BUILD_JDK }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JDK }}
          cache: gradle

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: JUnit Tests
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bettercontroller-snapshot
          path: |
            build/libs/bettercontroller-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
