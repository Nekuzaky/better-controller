name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 14 days if no
            further activity occurs. Drop a comment if it's still relevant.
          close-issue-message: >
            Closing this stale issue. If it's still relevant, please reopen or
            open a new one with up-to-date details.
          exempt-issue-labels: 'pinned,security,help wanted,confirmed'

          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has had no recent activity. It will be closed in 14 days if
            nothing happens. Push a commit or comment to keep it open.
          close-pr-message: >
            Closing this stale pull request. Feel free to reopen if you want
            to pick the work back up.
          exempt-pr-labels: 'pinned,blocked,wip'
