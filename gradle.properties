# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Forge / Minecraft
# 2847 is the last 1.12.2 build published with a "userdev" artifact; everything from 2855 on
# ships "userdev3" only, which ForgeGradle 2.3 cannot ask for. It is also the recommended build.
# 1.12.2 predates Fabric, so this line is Forge. It also predates LWJGL 3, which is why the
# controller layer loads GLFW itself in an isolated classloader -- see GlfwBridge.
minecraft_version=1.12.2
forge_version=14.23.5.2847
mappings_version=stable_39

# Mod
mod_version=0.3.0
maven_group=com.bettercontroller
archives_base_name=bettercontroller
