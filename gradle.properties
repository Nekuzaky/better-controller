# Gradle
org.gradle.jvmargs=-Xmx2G -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Fabric / Minecraft
# 26.1 is the first unobfuscated Minecraft release. Yarn is no longer
# officially maintained, so we use Mojang's official mappings (declared
# inside build.gradle via loom.officialMojangMappings()). Parchment can
# be layered on later for parameter names + javadocs if desired.
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.161.0+26.2

# Mod
mod_version=0.2.1
maven_group=com.bettercontroller
archives_base_name=bettercontroller
